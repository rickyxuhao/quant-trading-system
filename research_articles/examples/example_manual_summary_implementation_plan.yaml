strategy_name: ATR自适应动量策略 (ATR-Adaptive Momentum Strategy)
strategy_type: 趋势跟踪 / 机器学习
description: 该策略基于价格动量效应，使用20日收益率作为动量信号。与传统动量策略不同，它使用ATR（平均真实波幅）作为波动率度量，在高波动期（ATR高于历史均值）降低仓位，在低波动期提高仓位。策略适用于个股和ETF，特别适合震荡上行的市场环境。
entry_conditions:
- 20日收益率 > 5%
- ATR14 < 历史20日ATR的90%分位数（低波动环境）
- 成交量 > 20日均量的1.2倍（确认动量有量能支撑）
exit_conditions:
- 20日收益率 < -3%
- 持仓时间 > 10个交易日且当前收益率 < 2%
- ATR14 > 历史20日ATR的95%分位数（高波动退出）
features:
- name: :---
  description: :---
  calculation: :---
- name: momentum_20
  description: 20日动量
  calculation: close / close.shift(20) - 1
- name: atr_14
  description: 14日ATR
  calculation: talib.ATR(high, low, close, 14)
- name: atr_percentile
  description: ATR分位数
  calculation: atr_14在20日历史ATR中的百分位
- name: volume_ratio
  description: 量比
  calculation: volume / volume.rolling(20).mean()
- name: rsi_14
  description: 14日RSI
  calculation: talib.RSI(close, 14)
model:
  type: XGBoost
  params:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
backtest:
  period: 2018-01-01 至 2023-12-31
  rebalance_frequency: ''
  trading_costs:
    commission: 0.00025
    stamp_tax: 0.001
china_adaptations:
- T+1制度：信号在收盘前30分钟生成，次日开盘价执行
- 涨跌停限制：涨停不追，跌停不杀，增加额外的价格过滤
- 成本精细化：考虑印花税（卖出收取），高频调仓成本较高
- 流动性约束：过滤掉日均成交额小于1亿的股票
