[tool.poetry]
name = "quant-trading-system"
version = "0.1.0"
description = "量化交易系统 - 数据层、策略层、回测层、风控层、可视化层"
authors = ["Your Name <email@example.com>"]
readme = "README.md"
packages = [{include = "core"}, {include = "projects"}, {include = "shared"}, {include = "scripts"}, {include = "api"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "^2.0.0"
numpy = "^2.2.0"
tushare = "^1.2.89"
pymysql = "^1.1.0"
sqlalchemy = "^2.0.0"
dbutils = "^3.0.0"
tenacity = "^8.2.0"
ta-lib = "^0.6.8"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"
click = "^8.1.0"
plotly = "^6.6.0"

# 可选依赖（用于后续阶段）
scikit-learn = { version = "^1.3.0", optional = true }
streamlit = "^1.55.0"
backtrader = "^1.9.78.123"
vectorbt = "^0.28.4"
vnpy = "^4.3.0"
tensorflow = "^2.21.0"
pytorch-lightning = "^2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"

[tool.poetry.extras]
ml = ["scikit-learn"]
viz = ["streamlit"]
all = ["scikit-learn", "streamlit"]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
